<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PhoneDeck</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PhoneDeck">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#0f1115;--panel:#181b22;--key:#2a2f3a;--key2:#3a4150;--txt:#e8ebf2;--dim:#8b93a5;--acc:#4da3ff;--bad:#ff4d4f;--ok:#2ecc71}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{width:min(460px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.logo{display:flex;align-items:center;gap:12px}
.logo img{width:56px;height:56px;border-radius:14px}
h1{font-size:22px;margin:0}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
label{font-size:12px;color:var(--dim)}
textarea{width:100%;min-height:92px;resize:none;background:var(--panel);color:var(--txt);border:1px solid var(--key2);border-radius:12px;padding:12px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.row{display:flex;gap:10px}
button{height:48px;border:0;border-radius:12px;background:var(--key);color:var(--txt);font-size:15px;font-weight:600;padding:0 16px}
button.pri{background:var(--acc);color:#fff;flex:1}
button:disabled{opacity:.4}
button:active{filter:brightness(1.15)}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--txt)}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
#msg{min-height:20px;font-size:13px;color:var(--dim)}
#msg.bad{color:var(--bad)} #msg.ok{color:var(--ok)}
.note{font-size:12px;color:var(--dim);line-height:1.5;background:var(--panel);border-radius:12px;padding:10px 12px}
a{color:var(--acc)}
#off{display:none;font-size:12px;color:var(--ok)}
</style>
</head>
<body>
<main>
  <div class="logo"><img src="icons/icon-192.png" alt=""><div><h1>PhoneDeck</h1><div class="sub">Paste the link from your PC, then connect</div></div></div>

  <div>
    <label for="link">PC link (the line ending with ?key=…)</label>
    <textarea id="link" placeholder="http://192.168.43.175:8080/?key=CThgy6ab" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  </div>

  <div class="row">
    <button id="paste" type="button">Paste</button>
    <button id="go" class="pri" type="button">Connect</button>
  </div>

  <label class="chk"><input type="checkbox" id="auto"> Connect automatically when the app opens</label>
  <div id="msg"></div>

  <div class="note">
    Phone and PC must be on the same Wi-Fi or hotspot, with PhoneDeck running on the PC.
    The key changes each time the PC server starts, so paste the new link when it does.
    <span id="off"><br>✓ Ready for offline use</span>
  </div>
  <button id="forget" type="button" style="height:38px;font-size:13px;background:transparent;color:var(--dim)">Forget saved link</button>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const link = $('#link'), msg = $('#msg'), go = $('#go'), auto = $('#auto');
  const K = 'phonedeck.link', KA = 'phonedeck.auto';
  const ls = {
    get: k => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    del: k => { try { localStorage.removeItem(k); } catch {} }
  };
  let timer = 0;
  const say = (t, c = '') => { msg.textContent = t; msg.className = c; };

  // Pull a usable URL out of whatever was pasted (whole console line, extra spaces, missing http://).
  function parse(raw) {
    raw = (raw || '').trim();
    if (!raw) return null;
    let m = raw.match(/https?:\/\/[^\s"'<>]+/i);
    let s = m ? m[0] : (raw.match(/\d{1,3}(?:\.\d{1,3}){3}(?::\d+)?[^\s"'<>]*/) || [])[0];
    if (!s) return null;
    if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
    try { const u = new URL(s); return /^https?:$/.test(u.protocol) ? u : null; } catch { return null; }
  }

  function connect() {
    clearInterval(timer);
    const u = parse(link.value);
    if (!u) { say('That does not look like a link. Example: http://192.168.43.175:8080/?key=abc123', 'bad'); return; }
    if (!u.searchParams.get('key')) say('No ?key= in the link; connecting anyway…');
    ls.set(K, u.href);
    say('Connecting to ' + u.host + '…', 'ok');
    location.href = u.href;            // top-level navigation to the PC page (it is http, so it cannot be embedded here)
  }

  $('#paste').addEventListener('click', async () => {
    try {
      const t = await navigator.clipboard.readText();
      link.value = t.trim();
      const u = parse(t);
      say(u ? 'Link pasted. Tap Connect.' : 'Clipboard has no link. Paste it into the box.', u ? 'ok' : 'bad');
    } catch { link.focus(); say('Long-press the box and choose Paste.'); }
  });
  go.addEventListener('click', connect);
  link.addEventListener('input', () => { clearInterval(timer); say(''); });
  link.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); connect(); } });
  auto.addEventListener('change', () => ls.set(KA, auto.checked ? '1' : '0'));
  $('#forget').addEventListener('click', () => { ls.del(K); link.value = ''; clearInterval(timer); say('Saved link removed.'); });

  // Restore the last link; optional auto-connect with a short cancelable countdown.
  const saved = ls.get(K);
  auto.checked = ls.get(KA) === '1';
  if (saved) {
    link.value = saved;
    if (auto.checked) {
      let n = 2;
      say('Connecting in ' + n + 's… (tap the box to cancel)', 'ok');
      timer = setInterval(() => { n--; if (n <= 0) connect(); else say('Connecting in ' + n + 's… (tap the box to cancel)', 'ok'); }, 1000);
    }
  } else {
    // First run: if opened with ?link=... use it
    const q = new URLSearchParams(location.search).get('link');
    if (q) link.value = q;
  }

  // Offline support
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => { $('#off').style.display = 'inline'; }).catch(() => {});
  }
})();
</script>
</body>
</html>
